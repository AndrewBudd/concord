configuration:
  runtime: "concord-v2"

  arguments:
    # Metadata service URL (available on all boxcutter VMs)
    metadataUrl: "http://169.254.169.254"

flows:
  default:
    # Step 1: Create a boxcutter VM
    - task: boxcutter
      in:
        action: start
        type: firecracker
        vcpu: 2
        ram: 2048
      out:
        session: ${session}
        vmName: ${vmName}

    - log: "VM '${vmName}' is ready with session ${session.sessionId}"

    # Step 2: Run a command on the VM
    - task: boxcutter
      in:
        action: runStep
        session: ${session}
        command: |
          echo "Hello from $(hostname)"
          echo "Working directory: $(pwd)"
          export CONCORD_OUT_greeting="Hello from the VM"
        outVars:
          - greeting
      out:
        session: ${session}
        greeting: ${greeting}
        stdout: ${stdout}

    - log: "Command output: ${stdout}"
    - log: "Greeting: ${greeting}"

    # Step 3: Run another command that uses state from step 2
    - task: boxcutter
      in:
        action: runStep
        session: ${session}
        command: |
          echo "Previous greeting was: $CONCORD_ARG_greeting"
          echo "Creating a file..."
          echo "important data" > /tmp/concord-work/myfile.txt
          export CONCORD_OUT_fileCreated="true"
        outVars:
          - fileCreated
      out:
        session: ${session}
        fileCreated: ${fileCreated}

    - log: "File created: ${fileCreated}"

    # Step 4: Verify the file persists (same VM, same workspace)
    - task: boxcutter
      in:
        action: runStep
        session: ${session}
        command: |
          CONTENT=$(cat /tmp/concord-work/myfile.txt)
          echo "File content: $CONTENT"
          export CONCORD_OUT_fileContent="$CONTENT"
        outVars:
          - fileContent
      out:
        session: ${session}
        fileContent: ${fileContent}

    - log: "File content from persistent workspace: ${fileContent}"

    # Step 5: Deploy using an entry point script
    - task: boxcutter
      in:
        action: runStep
        session: ${session}
        command: |
          cat > /tmp/concord-work/entrypoint-deploy.sh << 'SCRIPT'
          #!/bin/bash
          APP_VERSION=$(echo "$CONCORD_ARGS" | jq -r '.appVersion // "unknown"')
          echo "Deploying version $APP_VERSION..."
          echo '{"deployResult": "deployed-'"$APP_VERSION"'"}' > /tmp/concord-work/.concord-output.json
          SCRIPT
      out:
        session: ${session}

    - task: boxcutter
      in:
        action: runStep
        session: ${session}
        entryPoint: deploy
        arguments:
          appVersion: "2.1.0"
        outVars:
          - deployResult
      out:
        session: ${session}
        deployResult: ${deployResult}

    - log: "Deploy result: ${deployResult}"

    # Step 6: Destroy the VM
    - task: boxcutter
      in:
        action: destroy
        session: ${session}

    - log: "Pipeline complete. VM destroyed."

  # Error handlers
  onFailure:
    - log: "Pipeline failed, cleaning up..."
    - task: boxcutter
      in:
        action: destroy
        session: ${session}
      ignoreErrors: true

  onCancel:
    - log: "Pipeline cancelled, cleaning up..."
    - task: boxcutter
      in:
        action: destroy
        session: ${session}
      ignoreErrors: true
